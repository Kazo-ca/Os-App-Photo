# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7).
#
# Only the Kazo OS submodule is fetched: the app uses the PhotoCraft build committed in
# src/Kazo.Photo/wwwroot/photocraft/, and PhotoCraft's sources (external/photocraft) are only
# needed by build-photocraft.yml, which calls the same reusable workflow on the branch it pushes.
# The end-to-end runs (npm run test:e2e) need a local Kazo OS host and stay a local check.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
