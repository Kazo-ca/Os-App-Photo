# Builds and tests the Release profile: the Kazo OS packages from nuget.org, at the version of the
# submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
#
# Until the Kazo OS release that brings ADR 0264 (exports of Craft apps; doc/en/plan.md,
# decision 2) is tagged and on nuget.org, the submodule sits on a commit of that work in
# Kazo-ca/Os (KAZOOS_BRANCH), and the Release build takes the Kazo OS projects from it
# (KazoOsUseSource=true). Work item 4 puts the submodule on the release tag and
# removes KAZOOS_BRANCH and KAZOOS_USE_SOURCE.
#
# workflow_call lets the PhotoCraft build workflow (work item 1) test the branch it pushes, since a
# push made with the workflow token starts no workflow.
name: CI

on:
  push:
    branches: [main, "photo/base"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Branch to check out and test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: "ci-${{ inputs.ref || github.ref }}"
  cancel-in-progress: true

env:
  KAZOOS_BRANCH: craft-exports/base
  KAZOOS_USE_SOURCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      # Only the Kazo OS submodule: the app uses the PhotoCraft build in wwwroot/photocraft/, and
      # PhotoCraft's sources (work item 1) are only needed to compile it.
      - name: Fetch the Kazo OS submodule
        run: git submodule update --init --depth 1 external/KazoOs

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the Kazo OS submodule
        run: bash .github/scripts/check-kazoos-submodule.sh

      - name: Build (Release)
        run: dotnet build -c Release -p:KazoOsUseSource=$KAZOOS_USE_SOURCE

      - name: Test
        run: dotnet test -c Release --no-build -p:KazoOsUseSource=$KAZOOS_USE_SOURCE
